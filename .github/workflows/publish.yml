name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC auth with JSR, no token needed
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tag matches the version in deno.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version deno.json)"
      - run: deno fmt --check
      - run: deno lint
      - run: deno doc --lint mod.ts
      - run: deno task test
      - run: deno publish
